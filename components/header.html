<header class="topbar glass-panel glass-outline">
  <a class="brand" href="/" data-route="/">
    <img class="brand-mark" src="/logo.svg" alt="EurekaCore logo" />
    <span class="brand-copy">
      <strong>{{APP_NAME}}</strong>
      <small>{{AI_NAME}} • {{NETWORK_NAME}} • {{DOMAIN}}</small>
    </span>
  </a>
  <nav class="nav">{{NAV_ITEMS}}</nav>
  <button class="wallet-pill" id="globalConnectButton" type="button">
    <span class="pulse" aria-hidden="true"></span>
    <span id="globalConnectLabel">{{GLOBAL_WALLET_LABEL}}</span>
  </button>
</header>
