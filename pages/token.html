<section class="page-shell">
  <article class="page-panel glass-outline">
    <div class="status-row">
      <div>
        <p class="eyebrow">Token</p>
        <h1 class="section-title">Base-aligned EUREKA token metadata</h1>
      </div>
      <a class="button primary" id="tokenExplorerButton" href="#" target="_blank" rel="noreferrer">Open BaseScan</a>
    </div>
    <p class="section-copy">Contract telemetry is loaded from Base and displayed with the shared EurekaCore configuration values.</p>
  </article>

  <div class="token-grid">
    <article class="token-card glass-outline">
      <p class="eyebrow">Name</p>
      <p class="metric-value" id="tokenNameValue">Loading…</p>
    </article>
    <article class="token-card glass-outline">
      <p class="eyebrow">Symbol</p>
      <p class="metric-value" id="tokenSymbolValue">Loading…</p>
    </article>
    <article class="token-card glass-outline">
      <p class="eyebrow">Total Supply</p>
      <p class="metric-value" id="tokenSupplyValue">Loading…</p>
    </article>
    <article class="token-card glass-outline">
      <p class="eyebrow">Decimals</p>
      <p class="metric-value" id="tokenDecimalsValue">Loading…</p>
    </article>
  </div>

  <article class="page-panel glass-outline">
    <p class="eyebrow">Contract Address</p>
    <div class="detail-item">
      <div class="detail-label">Base contract</div>
      <div class="detail-value code" id="tokenContractValue">Loading…</div>
    </div>
  </article>
</section>
