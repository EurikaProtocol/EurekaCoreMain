<style>
  :root {
    --bg-0: #0a1330;
    --bg-1: #0d1738;
    --bg-2: #131f4a;
    --glass: rgba(18, 28, 58, 0.55);
    --glass-strong: rgba(9, 14, 34, 0.82);
    --border-glass: rgba(130, 170, 255, 0.16);
    --border-glass-strong: rgba(150, 190, 255, 0.34);
    --cyan: #00e5ff;
    --cyan-bright: #66f3ff;
    --cyan-dim: #1b2a5c;
    --cyan-glow: rgba(0, 229, 255, 0.35);
    --violet: #a78bfa;
    --text-0: #eef1fb;
    --text-1: #a7add0;
    --text-2: #6b7397;
    --amber: #f0b34d;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-body);
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(ellipse 720px 420px at 15% -10%, rgba(167,139,250,0.12), transparent 60%),
      radial-gradient(ellipse 600px 380px at 100% 0%, rgba(0,229,255,0.08), transparent 55%),
      var(--bg-0);
    min-height: 100vh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- Install banner ---------- */
  .install-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--glass);
    border-bottom: 1px solid var(--border-glass);
    padding: 9px 16px;
    font-size: 12.5px;
    color: var(--text-1);
  }
  .install-banner.show { display: flex; }
  .install-banner .txt { flex: 1; line-height: 1.4; }
  .install-banner button {
    background: var(--cyan);
    color: var(--bg-0);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .install-banner .dismiss {
    background: none;
    color: var(--text-2);
    font-size: 16px;
    padding: 0 4px;
    font-weight: 400;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    background: var(--glass-strong);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--border-glass);
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(167,139,250,0.16), rgba(102,243,255,0.2), transparent);
    animation: sweep 2.4s ease-out 0.3s 1;
  }

  @keyframes sweep {
    to { left: 140%; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 0 14px rgba(102,243,255,0.3), 0 0 0 1px var(--border-glass-strong);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-text .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.2px;
    color: var(--text-0);
  }

  .brand-text .sub {
    font-size: 10.5px;
    color: var(--text-2);
    margin-top: 1px;
  }

  .wallet-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,229,255,0.08);
    border: 1px solid var(--border-glass-strong);
    color: var(--cyan-bright);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .wallet-pill:active { transform: scale(0.96); }
  .wallet-pill.connected { background: rgba(0,229,255,0.14); color: var(--text-0); }

  .wallet-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-2);
  }
  .wallet-pill.connected .dot {
    background: var(--cyan-bright);
    box-shadow: 0 0 6px var(--cyan-glow);
  }

  /* ---------- Stat chips ---------- */
  .stats {
    display: flex;
    gap: 10px;
    padding: 14px 16px 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .stats::-webkit-scrollbar { display: none; }

  .stat-card {
    flex: 0 0 auto;
    min-width: 128px;
    background: var(--glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    backdrop-filter: blur(10px);
  }

  .stat-card .label {
    font-size: 10.5px;
    color: var(--text-2);
    margin-bottom: 4px;
  }

  .stat-card .value {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-0);
    font-weight: 500;
  }

  .stat-card .value.dim { color: var(--text-2); }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row { display: flex; gap: 9px; max-width: 100%; }
  .row.user { justify-content: flex-end; }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--cyan-dim);
    border: 1px solid var(--border-glass-strong);
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .avatar svg { width: 14px; height: 14px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    line-height: 1.5;
  }

  .row.assistant .bubble {
    background: var(--glass);
    border: 1px solid var(--border-glass);
    border-left: 2px solid var(--cyan);
    color: var(--text-0);
    backdrop-filter: blur(10px);
  }

  .row.user .bubble {
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text-0);
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }

  .bubble .note {
    font-size: 11px;
    color: var(--text-2);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .card-mini {
    margin-top: 8px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-1);
  }
  .card-mini .kv { display: flex; justify-content: space-between; padding: 2px 0; }
  .card-mini .kv span:first-child { color: var(--text-2); font-family: var(--font-body); }

  .card-mini.rejected { border-color: rgba(240,179,77,0.35); }
  .card-mini .kv.status span:last-child { color: var(--amber); }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0.4;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ---------- Input area ---------- */
  .composer {
    position: sticky;
    bottom: 0;
    z-index: 20;
    background: var(--glass-strong);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-top: 1px solid var(--border-glass);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 9px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-glass);
    color: var(--text-1);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip:active { border-color: var(--border-glass-strong); color: var(--cyan-bright); }

  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-1);
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    padding: 6px 6px 6px 16px;
  }

  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-0);
    font-family: var(--font-body);
    font-size: 14.5px;
    min-width: 0;
  }
  .input-bar input::placeholder { color: var(--text-2); }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--cyan);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { width: 15px; height: 15px; }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 480px;
    background: var(--bg-1);
    border: 1px solid var(--border-glass-strong);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
    z-index: 41;
    transition: transform 0.28s cubic-bezier(.2,.9,.3,1);
  }
  .sheet.open { transform: translate(-50%, 0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    margin: 8px auto 14px;
  }

  .sheet h3 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 3px;
  }
  .sheet .sheet-sub {
    font-size: 12px;
    color: var(--text-2);
    margin: 0 0 16px;
  }

  .wallet-option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 9px;
    cursor: pointer;
    color: var(--text-0);
    font-family: var(--font-body);
    font-size: 14px;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .wallet-option:active { border-color: var(--border-glass-strong); background: rgba(0,229,255,0.06); }

  .wallet-option .icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    background: var(--bg-2);
  }

  .wallet-option .meta { display: flex; flex-direction: column; gap: 1px; }
  .wallet-option .meta .n { font-weight: 500; }
  .wallet-option .meta .d { font-size: 11.5px; color: var(--text-2); }

  .sheet-close {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--text-2);
    font-size: 13px;
    padding: 10px;
    margin-top: 4px;
    cursor: pointer;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
</style>
</head>
<body>

<div class="app">

  <div class="install-banner" id="installBanner">
    <span class="txt" id="installText">Add TINAN AI to your home screen for the full-screen app experience.</span>
    <button id="installBtn" onclick="handleInstallClick()">Install</button>
    <button class="dismiss" onclick="dismissInstall()">✕</button>
  </div>

  <header>
    <div class="brand">
      <img class="mark" id="brandMark" alt="TINAN AI mascot" />
      <div class="brand-text">
        <span class="name">TINAN AI</span>
        <span class="sub">Natural Intelligence</span>
      </div>
    </div>
    <button class="wallet-pill" id="walletPill" onclick="openSheet()">
      <span class="dot"></span>
      <span id="walletPillText">Connect wallet</span>
    </button>
  </header>

  <div class="stats" id="statsRow">
    <div class="stat-card">
      <div class="label">EURIKA balance</div>
      <div class="value dim" id="statEureka">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Network</div>
      <div class="value dim" id="statNetwork">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Wallet health</div>
      <div class="value dim" id="statHealth">—</div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="composer">
    <div class="chips">
      <div class="chip" onclick="quickAction('wallet')">Wallet</div>
      <div class="chip" onclick="quickAction('token')">Token info</div>
      <div class="chip" onclick="quickAction('dashboard')">Dashboard</div>
      <div class="chip" onclick="quickAction('energy')">Proof of Energy</div>
      <div class="chip" onclick="quickAction('notes')">Knowledge</div>
    </div>
    <div class="input-bar">
      <input id="msgInput" type="text" placeholder="Ask TINAN AI…" autocomplete="off" />
      <button class="send-btn" onclick="handleSend()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5L20.5 3.5L15.5 20.5L11 13L3 11.5Z" stroke="#05070a" stroke-width="1.6" stroke-linejoin="round" fill="#05070a"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h3>Connect a wallet</h3>
  <p class="sheet-sub">Demo mode — this simulates a connection. No real wallet or key is accessed.</p>

  <button class="wallet-option" onclick="connectWallet('MetaMask')">
    <span class="icon">🦊</span>
    <span class="meta"><span class="n">MetaMask</span><span class="d">Browser extension &amp; mobile</span></span>
  </button>
  <button class="wallet-option" onclick="connectWallet('WalletConnect')">
    <span class="icon">◈</span>
    <span class="meta"><span class="n">WalletConnect</span><span class="d">Scan with any supported wallet</span></span>
  </button>
  <button class="wallet-option" onclick="connectWallet('Coinbase Wallet')">
    <span class="icon">◐</span>
    <span class="meta"><span class="n">Coinbase Wallet</span><span class="d">App &amp; browser extension</span></span>
  </button>

  <button class="sheet-close" onclick="closeSheet()">Cancel</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('msgInput');
  let connected = false;
  let walletAddr = '';
  let deferredPrompt = null;

  /* ---------- Install (PWA) handling ---------- */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function dismissInstall() {
    document.getElementById('installBanner').classList.remove('show');
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) {
      document.getElementById('installText').textContent = 'Install TINAN AI as an app on this device.';
      document.getElementById('installBanner').classList.add('show');
    }
  });

  function handleInstallClick() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(() => {
        deferredPrompt = null;
        dismissInstall();
      });
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (!isStandalone && isIOS) {
      document.getElementById('installText').textContent = 'To install: tap the Share icon, then "Add to Home Screen".';
      document.getElementById('installBtn').style.display = 'none';
      document.getElementById('installBanner').classList.add('show');
    }
  });

  function avatarSvg() {
    return `<img src="${MASCOT_SRC}" alt="" />`;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"><p>${escapeHtml(text)}</p></div>`;
    chat.appendChild(row);
    scrollToBottom();
  }

  function addAssistantMessage(html) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = `<div class="avatar">${avatarSvg()}</div><div class="bubble">${html}</div>`;
    chat.appendChild(row);
    scrollToBottom();
  }

  function showTyping(callback, delay = 650) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    row.innerHTML = `<div class="avatar">${avatarSvg()}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    scrollToBottom();
    setTimeout(() => {
      const t = document.getElementById('typingRow');
      if (t) t.remove();
      callback();
    }, delay);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function openSheet() {
    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
  }
  function closeSheet() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
  }

  function shortAddr(a) {
    return a.slice(0, 6) + '…' + a.slice(-4);
  }

  function connectWallet(provider) {
    closeSheet();
    connected = true;
    walletAddr = '0x' + Array.from({length: 40}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join('');

    document.getElementById('walletPill').classList.add('connected');
    document.getElementById('walletPillText').textContent = shortAddr(walletAddr);

    document.getElementById('statEureka').textContent = '1,240.5';
    document.getElementById('statEureka').classList.remove('dim');
    document.getElementById('statNetwork').textContent = 'Ethereum';
    document.getElementById('statNetwork').classList.remove('dim');
    document.getElementById('statHealth').textContent = 'Nominal';
    document.getElementById('statHealth').classList.remove('dim');

    addUserMessage(`Connect ${provider}`);
    showTyping(() => {
      addAssistantMessage(`
        <p>${provider} connected. I never store or transmit your private key — signing always happens locally in your wallet.</p>
        <div class="card-mini">
          <div class="kv"><span>Address</span><span>${shortAddr(walletAddr)}</span></div>
          <div class="kv"><span>Network</span><span>Ethereum Mainnet</span></div>
          <div class="kv"><span>EURIKA</span><span>1,240.5</span></div>
        </div>
        <div class="note">Demo data for illustration — not a live on-chain query.</div>
      `);
    });
  }

  function quickAction(type) {
    const prompts = {
      wallet: 'Show my wallet overview',
      token: 'What are the EURIKA token details?',
      dashboard: 'Give me my dashboard summary',
      energy: 'Submit a Proof of Energy reading',
      notes: 'Help me organize my project notes'
    };
    respond(prompts[type]);
  }

  function handleSend() {
    const val = input.value.trim();
    if (!val) return;
    input.value = '';
    respond(val);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  function respond(text) {
    addUserMessage(text);
    const lower = text.toLowerCase();

    showTyping(() => {
      if (/(private key|seed phrase|recovery phrase|secret key)/.test(lower)) {
        addAssistantMessage(`<p>I can't access, display, or ask for private keys or seed phrases — not from you, and not from any wallet. All signing stays local to your wallet app. If you're trying to connect or send a transaction, I can walk you through doing it safely.</p>`);
        return;
      }

      if (!connected && /(wallet|balance|address|connect)/.test(lower)) {
        addAssistantMessage(`<p>No wallet is connected yet, so I don't have address or balance data to show. Connect one and I'll pull it up.</p>`);
        openSheet();
        return;
      }

      if (/(wallet|balance|overview|health)/.test(lower) && connected) {
        addAssistantMessage(`
          <p>Here's your current wallet snapshot:</p>
          <div class="card-mini">
            <div class="kv"><span>Address</span><span>${shortAddr(walletAddr)}</span></div>
            <div class="kv"><span>Network</span><span>Ethereum</span></div>
            <div class="kv"><span>Native balance</span><span>0.842 ETH</span></div>
            <div class="kv"><span>EURIKA</span><span>1,240.5</span></div>
            <div class="kv"><span>Recent tx</span><span>2 in 24h</span></div>
          </div>
          <div class="note">Demo data — wire this to an RPC/explorer call for live values.</div>
        `);
        return;
      }

      if (/(token|eurika|eureka|supply|contract address|holders|decimals)/.test(lower)) {
        addAssistantMessage(`
          <p>EURIKA token reference (existing ERC-20 — this UI does not deploy a new token):</p>
          <div class="card-mini">
            <div class="kv"><span>Symbol</span><span>EURIKA</span></div>
            <div class="kv"><span>Decimals</span><span>18</span></div>
            <div class="kv"><span>Total supply</span><span>100,000,000</span></div>
            <div class="kv"><span>Contract</span><span>0x0000…0000</span></div>
          </div>
          <div class="note">Placeholder values — connect the real EURIKA contract address and an explorer API for live supply and holder stats.</div>
        `);
        return;
      }

      if (/(proof of energy|solar|inverter|smart meter|energy reading)/.test(lower)) {
        addAssistantMessage(`
          <p>Proof of Energy — verification result:</p>
          <div class="card-mini rejected">
            <div class="kv status"><span>STATUS</span><span>REJECTED</span></div>
            <div class="kv"><span>Reason</span><span>No meter data linked</span></div>
            <div class="kv"><span>Reward</span><span>0 EURIKA</span></div>
            <div class="kv"><span>Action</span><span>Awaiting device pairing</span></div>
          </div>
          <div class="note">Simulated Security Shield response — connect a supported inverter/meter (Solis, Sungrow, FoxESS, GoodWe, Modbus) to submit a real reading.</div>
        `);
        return;
      }

      if (/(dashboard|portfolio|notification|network status)/.test(lower)) {
        addAssistantMessage(`
          <p>Dashboard summary:</p>
          <div class="card-mini">
            <div class="kv"><span>Portfolio</span><span>${connected ? '3 assets tracked' : 'No wallet linked'}</span></div>
            <div class="kv"><span>Activity</span><span>${connected ? '2 tx · 24h' : '—'}</span></div>
            <div class="kv"><span>Notifications</span><span>0 unread</span></div>
            <div class="kv"><span>Network status</span><span>Operational</span></div>
          </div>
        `);
        return;
      }

      if (/(note|idea|roadmap|whitepaper|document|organize)/.test(lower)) {
        addAssistantMessage(`<p>I can turn raw notes, docs, or a whitepaper draft into structured sections — headings, key terms, open questions, and a roadmap outline. Paste the source material and tell me the target format, and I'll structure it.</p>`);
        return;
      }
